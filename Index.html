<script>
// ====== SOZLAMALAR (shu yerni o'zgartiring) ======
const CONFIG={
 title:"Kamchilik",
 desc:"Kamchilik filmi. Rejissyor va aktyor: Muhammadaziz Odilov.",
 pay:"To'lov: [karta raqami va narx shu yerga yoziladi]. To'lagach, chekni yuboring va kod oling.",
 youtube:"",
 hashes:["6cf1590ffaa84b2e81392a941cb04956b77638f771e30b593db66ebc323bc8a6", "3098d9cef4a6a5e5a3c796fbe061c6868519944a9b29f57b665dda49ed72988c", "ffff6917d1c9409c74bc796e75c8dc1ab33278610af52b1b9d4eec5260764cab", "9390baa763949e569e797ce01c86b9e40eba6047e21274bb4b8e72a5aaf19f29", "7fd95d3b3aac851ca520f6d12d4814b50a589245223bf4a5272e14ae42bae1ea"]
};
// ================================================
const $=i=>document.getElementById(i);
$('t').textContent=CONFIG.title;$('d').textContent=CONFIG.desc;$('pay').textContent=CONFIG.pay;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s.trim().toLowerCase()));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function ytId(u){const m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?m[1]:null}
$('go').onclick=async()=>{
 const c=$('code').value;if(!c.trim())return;
 if(!CONFIG.hashes.includes(await sha(c))){$('msg').textContent="Kod noto'g'ri.";return}
 $('gate').hidden=true;const p=$('pl');p.hidden=false;
 const id=CONFIG.youtube&&ytId(CONFIG.youtube);
 if(id){p.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'" allow="fullscreen" allowfullscreen></iframe><a class="btn" target="_blank" rel="noopener" href="'+CONFIG.youtube+'">YouTube\'da ochish</a>'}
 else p.textContent="Kino tez orada qo'yiladi.";
};
